<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TeamSplit · Piste B · Chaleureuse & terroir</title>
<style>
*{box-sizing:border-box} body{margin:0;background:var(--fond);color:var(--texte);}
main{max-width:390px;margin:0 auto;padding:40px 16px 100px}
header{margin-bottom:16px} .surtitre{margin:0 0 6px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--doux)}
h1{margin:0 0 6px;line-height:1.05} .accroche{margin:0;color:var(--doux);font-size:15px}
.recherche{display:flex;align-items:center;height:48px;padding:0 14px;font-size:15px;color:var(--doux);margin-bottom:12px}
.puces{display:flex;gap:8px;margin-bottom:10px}
.puce{min-height:44px;padding:0 16px;display:inline-flex;align-items:center;font-size:15px;background:transparent;color:var(--texte);font-family:inherit}
.compteur{font-size:14px;color:var(--doux);margin:4px 0 12px} .compteur b{color:var(--texte)}
.liste{display:flex;flex-direction:column;gap:10px;padding:0;margin:0;list-style:none}
.joueur{display:flex;align-items:center;gap:12px;min-height:64px;padding:8px 12px;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.avatar{width:42px;height:42px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.qui{flex:1} .label{font-size:16px;display:block} .niveau{font-size:14px;color:var(--doux)}
.case{width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.fab{position:fixed;left:16px;right:16px;bottom:16px;max-width:358px;margin:0 auto;height:56px;display:flex;align-items:center;justify-content:center;background:var(--accent);color:var(--sur-accent);font-weight:700;font-size:16px;border-radius:var(--rayon);border:0;font-family:inherit;text-decoration:none}
.etiquette{position:fixed;top:8px;right:8px;font:12px/1 Inter,sans-serif;background:rgba(0,0,0,.65);color:#fff;padding:5px 8px;border-radius:4px;z-index:9}

:root{--fond:#F4EFE6;--surface:#FFFBF5;--texte:#2E2A24;--doux:#6B6457;--accent:#9C4421;--sur-accent:#FFFFFF;--choisi:#E7EDE2;--rayon:22px;}
body{font-family:Poppins,sans-serif;}
h1{font-weight:500;font-size:30px}
.puce{border-radius:999px;border:none;background:#E3D9C8}
.puce.on{background:#6E8063;color:#fff}
.joueur{border:none;border-radius:var(--rayon);background:var(--surface);box-shadow:0 4px 14px rgba(80,60,30,.08)}
.joueur.on{background:var(--choisi)}
.avatar{border-radius:50%;background:#C9A27A;color:#2E2A24}
.case{border-radius:50%;border:2px solid #C9BBA3}
.joueur.on .case{background:#6E8063;border-color:#6E8063;color:#fff}
.recherche{border-radius:999px;border:none;background:var(--surface);box-shadow:inset 0 0 0 1px #D9CDB8}
.fab{border-radius:999px}
</style>
</head>
<body>
<span class="etiquette">Piste B · Chaleureuse & terroir</span>
<main>
  <header>
    <p class="surtitre">Salut Yanis 👋</p>
    <h1>TeamSplit</h1>
    <p class="accroche">Des équipes justes, en un geste</p>
  </header>
  <label class="recherche" for="q">Rechercher un joueur…</label>
  <input id="q" type="search" hidden>
  <div class="puces" role="group" aria-label="Filtrer par sport">
    <button class="puce" type="button" aria-pressed="false">Tous</button>
    <button class="puce on" type="button" aria-pressed="true">Foot</button>
    <button class="puce" type="button" aria-pressed="false">Basket</button>
    <button class="puce" type="button" aria-pressed="false">Volley</button>
  </div>
  <p class="compteur">Foot · 12 joueurs · <b>6 présents</b></p>
  <ul class="liste">
    <li><button type="button" class="joueur on" aria-pressed="true">
      <span class="avatar" aria-hidden="true">Y</span>
      <span class="qui"><span class="label">Yanis</span><span class="niveau">Milieu · niveau 4/5 ★★★★☆</span></span>
      <span class="case" aria-hidden="true">✓</span></button></li>
    <li><button type="button" class="joueur on" aria-pressed="true">
      <span class="avatar" aria-hidden="true">L</span>
      <span class="qui"><span class="label">Luca</span><span class="niveau">Défense · niveau 3/5 ★★★☆☆</span></span>
      <span class="case" aria-hidden="true">✓</span></button></li>
    <li><button type="button" class="joueur on" aria-pressed="true">
      <span class="avatar" aria-hidden="true">I</span>
      <span class="qui"><span class="label">Inès</span><span class="niveau">Attaque · niveau 5/5 ★★★★★</span></span>
      <span class="case" aria-hidden="true">✓</span></button></li>
    <li><button type="button" class="joueur" aria-pressed="false">
      <span class="avatar" aria-hidden="true">N</span>
      <span class="qui"><span class="label">Noah</span><span class="niveau">Gardien · niveau 3/5 ★★★☆☆</span></span>
      <span class="case" aria-hidden="true"></span></button></li>
    <li><button type="button" class="joueur on" aria-pressed="true">
      <span class="avatar" aria-hidden="true">S</span>
      <span class="qui"><span class="label">Sami</span><span class="niveau">Milieu · niveau 2/5 ★★☆☆☆</span></span>
      <span class="case" aria-hidden="true">✓</span></button></li>
    <li><button type="button" class="joueur on" aria-pressed="true">
      <span class="avatar" aria-hidden="true">L</span>
      <span class="qui"><span class="label">Léo</span><span class="niveau">Attaque · niveau 4/5 ★★★★☆</span></span>
      <span class="case" aria-hidden="true">✓</span></button></li>
    <li><button type="button" class="joueur on" aria-pressed="true">
      <span class="avatar" aria-hidden="true">M</span>
      <span class="qui"><span class="label">Maé</span><span class="niveau">Gardien · niveau 4/5 ★★★★☆</span></span>
      <span class="case" aria-hidden="true">✓</span></button></li>
  </ul>
</main>
<a class="fab" href="#">Faire les équipes (6)</a>
<script>
  // Toucher une carte coche ou décoche le joueur.
  document.querySelectorAll(".joueur").forEach(function (carte) {
    carte.addEventListener("click", function () {
      const actif = carte.classList.toggle("on");
      carte.setAttribute("aria-pressed", actif);
      carte.querySelector(".case").textContent = actif ? "✓" : "";
    });
  });
</script>
</body>
</html>
